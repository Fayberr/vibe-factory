name: Build Windows client

# Tests the core, builds the Godot 4.7 .NET client and exports the Windows
# desktop build from Linux (headless Godot cross-export), then publishes it as
# an artifact and as the repository's "Latest" release (tag latest-build), which
# is replaced on every push so the repo page always offers the newest build.

on:
  push:
    branches:
      - main
    # Docs and metadata only: there is nothing to compile, so the Windows client is
    # not rebuilt and the latest-build release is left as it is. Run the workflow by
    # hand (workflow_dispatch) when a build is wanted from such a commit anyway.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write # move the latest-build tag and replace the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_STATUS: stable
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  windows-client:
    name: Windows client
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version lives in VERSION and is stamped into the client at build time, so a typo there
      # would ship a build whose corner reads something odd. Check the shape before compiling.
      - name: Check the version file
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be three numbers like 0.1.0, got '$version'"
            exit 1
          fi
          echo "Version: $version"

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Headless Linux editor (.NET) + only the Windows x86_64 export templates
      # (~215 MB instead of the full 1.2 GB template archive).
      - name: Cache Godot engine and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}.mono
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-mono-linux-editor-windows-templates

      - name: Download Godot .NET and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p ~/godot
          curl -fsSL --retry 3 -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_mono_export_templates.tpz"
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}.mono
          mkdir -p "$templates"
          unzip -q -j /tmp/templates.tpz 'templates/version.txt' 'templates/windows_*_x86_64*' -d "$templates"
          rm -f /tmp/godot.zip /tmp/templates.tpz
          ls -la "$templates"

      - name: Locate Godot
        run: |
          set -euo pipefail
          godot="$(find ~/godot -type f -name 'Godot_v*_mono_linux.x86_64' | head -n 1)"
          test -n "$godot"
          chmod +x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
          "$godot" --headless --version

      - name: Unit tests
        run: dotnet test -c Release

      - name: Build C# project (Release)
        run: dotnet build godot -c Release

      - name: Import Godot project
        run: '"$GODOT" --headless --path godot --import'

      # Godot exits 0 even when the C# publish fails, so verify the output itself:
      # the exe, the pack, and the data folder with the published game assembly.
      - name: Export Windows Desktop
        working-directory: godot
        run: |
          set -euo pipefail
          mkdir -p ../build
          "$GODOT" --headless --export-release "Windows Desktop" ../build/VibeFactory.exe 2>&1 | tee ../export.log
          test -f ../build/VibeFactory.exe
          test -f ../build/VibeFactory.pck
          test -f ../build/data_FactorySim.Client_windows_x86_64/FactorySim.Client.dll
          test -f ../build/data_FactorySim.Client_windows_x86_64/FactorySim.Core.dll
          if grep -q '^ERROR:' ../export.log; then
            echo "::error::Godot reported errors during export (see log above)"
            exit 1
          fi
          ls -la ../build

      - name: Package VibeFactory-Windows.zip
        run: |
          set -euo pipefail
          cd build
          zip -qr ../VibeFactory-Windows.zip .
          cd ..
          unzip -l VibeFactory-Windows.zip | tail -n 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeFactory-Windows
          path: VibeFactory-Windows.zip
          if-no-files-found: error

      # A full release (not a pre-release) marked "Latest" is what GitHub shows in
      # the repository sidebar. Deleting and recreating it each time keeps its date
      # and name current instead of editing a release from the first build. The
      # release action reuses an existing tag as-is, so the rolling tag is moved to
      # this commit first.
      - name: Replace the previous latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view latest-build --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete latest-build --repo "$GITHUB_REPOSITORY" --yes
          fi
          git tag -f latest-build "$GITHUB_SHA"
          git push -f origin refs/tags/latest-build
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: 'Vibe Factory ${{ env.VERSION }} build #${{ github.run_number }} (${{ env.SHORT_SHA }})'
          prerelease: false
          make_latest: true
          files: VibeFactory-Windows.zip
          fail_on_unmatched_files: true
          body: |
            Automated Windows build of Vibe Factory (Godot ${{ env.GODOT_VERSION }} .NET),
            rebuilt on every push.

            **Download:** `VibeFactory-Windows.zip` below. Unzip it and run `VibeFactory.exe`.
            Keep the `.pck` and the `data_*` folder next to the executable.

            - Version: ${{ env.VERSION }}
            - Branch: `${{ github.ref_name }}`
            - Commit: ${{ github.sha }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
